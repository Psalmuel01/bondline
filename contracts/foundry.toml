[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# MonadVision uses Sourcify for verification on testnet (chain 10143).
# Deploy + verify:
#   forge script script/Deploy.s.sol --rpc-url monad_testnet --broadcast \
#     --verify --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/
[etherscan]
monad_testnet = { key = "unused", chain = 10143, url = "https://sourcify-api-monad.blockvision.org/" }
